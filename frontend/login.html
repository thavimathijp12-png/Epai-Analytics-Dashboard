<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPAI | Secure Analytics Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --font-primary: 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-primary); background-color: var(--bg-primary); display: flex; height: 100vh; overflow: hidden; }
        
        .login-left {
            flex: 1; background: linear-gradient(135deg, #0f172a, #1e293b); color: white;
            display: flex; flex-direction: column; justify-content: center; padding: 60px;
            position: relative; overflow: hidden;
        }
        .login-left::before {
            content: ''; position: absolute; inset: 0; opacity: 0.1;
            background-image: radial-gradient(circle at 20px 20px, #ffffff 2px, transparent 0);
            background-size: 40px 40px;
        }
        .brand-container { position: relative; z-index: 10; max-width: 500px; }
        .logo-svg { width: 64px; height: 64px; color: var(--primary); margin-bottom: 32px; }
        .brand-title { font-size: 3rem; font-weight: 800; line-height: 1.1; margin-bottom: 24px; letter-spacing: -0.03em; }
        .brand-subtitle { font-size: 1.125rem; color: #94a3b8; line-height: 1.6; font-weight: 400; }
        
        .login-right {
            width: 500px; background: var(--surface); display: flex; flex-direction: column;
            justify-content: center; padding: 60px; box-shadow: -10px 0 30px rgba(0,0,0,0.05);
        }
        .login-header { margin-bottom: 40px; }
        .login-header h2 { font-size: 1.75rem; color: var(--text-primary); margin-bottom: 8px; font-weight: 700; letter-spacing: -0.02em; }
        .login-header p { color: var(--text-muted); font-size: 0.875rem; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
            font-size: 1rem; font-family: var(--font-primary); color: var(--text-primary); transition: all 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        
        .form-footer { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 0.875rem; }
        .checkbox { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer; }
        .forgot-link { color: var(--primary); text-decoration: none; font-weight: 500; }
        
        .btn-submit {
            width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--primary);
            color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        
        #error-msg { color: #ef4444; font-size: 0.875rem; text-align: center; margin-top: 16px; min-height: 20px; font-weight: 500; }
        
        .secure-badge {
            margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px;
            color: var(--text-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        }
        
        @media (max-width: 900px) {
            .login-left { display: none; }
            .login-right { width: 100%; padding: 40px; }
        }
    </style>
</head>
<body>
    <div class="login-left">
        <div class="brand-container">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="55" width="12" height="25" fill="currentColor" opacity="0.6"/>
                <rect x="44" y="35" width="12" height="45" fill="currentColor" opacity="0.8"/>
                <rect x="68" y="15" width="12" height="65" fill="currentColor"/>
                <circle cx="50" cy="25" r="10" fill="white"/>
            </svg>
            <h1 class="brand-title">Turn Employee Data Into Actionable Intelligence.</h1>
            <p class="brand-subtitle">Understand workforce performance, identify retention risks, and make data-driven people decisions with EPAI.</p>
        </div>
    </div>
    
    <div class="login-right">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to Workforce Intelligence</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" value="admin@epai.com" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="password123" required placeholder="••••••••">
            </div>
            <div class="form-footer">
                <label class="checkbox">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
            <div id="error-msg"></div>
        </form>
        
        <div class="secure-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Secure Workforce Analytics Platform
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.querySelector('.btn-submit');
            
            errorMsg.textContent = '';
            btn.textContent = 'Authenticating...';
            btn.style.opacity = '0.7';

            try {
                // API Configuration
                const apiUrl = window.ENV_API_URL 
                    ? `${window.ENV_API_URL}/auth/login`
                    : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                        ? 'http://localhost:5000/api/auth/login' 
                        : '/api/auth/login');

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success && data.data && data.data.token) {
                    localStorage.setItem('epai_token', data.data.token);
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.message || 'Authentication failed. Please check credentials.';
                }
            } catch (error) {
                errorMsg.textContent = 'Server connection failed. Please ensure the backend is running.';
            } finally {
                btn.textContent = 'Sign In';
                btn.style.opacity = '1';
            }
        });

        // Redirect if already logged in with a valid token
        const existingToken = localStorage.getItem('epai_token');
        if (existingToken && existingToken !== 'undefined' && existingToken !== 'null') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
